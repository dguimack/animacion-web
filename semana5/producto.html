<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tarjeta de producto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #f5f1ea;
    }

    .tarjeta {
      width: 320px;
      padding: 20px;

      background: white;

      border-radius: 16px;

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

    
      transition:
        transform 300ms ease,
        box-shadow 300ms ease;
    }


    .tarjeta:hover {
      transform: translateY(-6px);

      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.22);
    }


    .foto {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  margin-bottom: 16px;
}

.foto img {
  width: 100%;
  height: 260px;

  object-fit: contain;

  display: block;

  border-radius: 12px;
}


    h2 {
      margin: 0 0 8px;

      font-size: 21px;

      color: #222;
    }


    .precio {
      margin: 0 0 16px;

      font-size: 16px;

      color: #555;
    }


    .boton {
      width: 100%;

      padding: 13px 20px;

      border: none;

      border-radius: 30px;

      background: #2e8cff;

      color: white;

      font-size: 15px;

      cursor: pointer;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      transition:
        background 150ms ease,
        transform 100ms ease;
    }


    .boton:hover {
      background: #1675e8;
    }


    .boton:active {
      transform: scale(0.96);
    }


    .boton:focus-visible {
      outline: 3px solid #93c6ff;

      outline-offset: 4px;
    }


    .spinner {
      display: none;

      width: 17px;
      height: 17px;

      border: 3px solid rgba(255, 255, 255, 0.4);

      border-top-color: white;

      border-radius: 50%;

      animation:
        girar 800ms linear infinite;
    }


    .boton.cargando .spinner {
      display: inline-block;
    }


    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    .boton.listo {
      background: #2eb87c;
    }


    .check {
      display: none;

      width: 18px;
      height: 18px;
    }

    .boton.listo .check {
      display: inline-block;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        transition: none !important;

        animation: none !important;
      }

    }

  </style>

</head>


<body>

  <article class="tarjeta">

    <div class="foto">

      <img
        src="https://minisitios.ripley.com.pe/minisitios/blog/ramo-hot-wheels/img/regalar-ramo-hot-wheels.webp"
        alt="Ramo de Hot Wheels"
      >

    </div>


    <!-- NOMBRE -->

    <h2>
      Ramo de Hot Wheels
    </h2>


    <!-- PRECIO -->

    <p class="precio">
      S/ 50.00
    </p>


    <button
      class="boton"
      id="enviar"
      type="button"
    >


      <span class="spinner"></span>


      <span class="texto">
        Añadir
      </span>


      <svg
        class="check"
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path d="M5 12l4 4L19 7"></path>

      </svg>


    </button>


  </article>


  <script>


    const boton = document.querySelector("#enviar");


    const texto = boton.querySelector(".texto");


    boton.addEventListener("click", () => {


      boton.disabled = true;


      boton.classList.add("cargando");


      texto.textContent = "Añadiendo";


      setTimeout(() => {


        boton.classList.remove("cargando");

        boton.classList.add("listo");

        texto.textContent = "Añadido";


      }, 1500);


    });


  </script>


</body>

</html>
